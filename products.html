<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Products - People Plus Network</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Poppins', sans-serif; background: #f5f7fa; }

        /* ============ DESKTOP NAVBAR (TOP) ============ */
        .desktop-navbar {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            box-shadow: 0 2px 20px rgba(0, 0, 0, 0.1);
            padding: 1rem 0;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            transition: all 0.3s ease;
        }
        
        .desktop-navbar .container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }
        
        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
        }
        
        .logo img {
            height: 45px;
            border-radius: 8px;
            background: white;
            padding: 3px;
        }
        
        .logo-text {
            font-size: 1.3rem;
            font-weight: 800;
            color: white;
            letter-spacing: 1px;
        }
        
        .nav-links {
            display: flex;
            align-items: center;
            gap: 25px;
            list-style: none;
            margin: 0;
            padding: 0;
        }
        
        .nav-links li a {
            color: white;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s ease;
            position: relative;
            padding: 5px 0;
        }
        
        .nav-links li a:hover, .nav-links li a.active {
            color: #ffd700;
        }
        
        .nav-links li a.active::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 0;
            right: 0;
            height: 2px;
            background: #ffd700;
            border-radius: 2px;
        }
        
        .btn-register {
            background: #ffd700;
            color: #333 !important;
            padding: 8px 25px !important;
            border-radius: 50px;
            font-weight: 600;
        }
        
        .btn-register:hover {
            background: #ffed4a;
            transform: translateY(-2px);
        }
        
        .cart-badge {
            background: #dc3545;
            color: white;
            border-radius: 50%;
            padding: 2px 6px;
            font-size: 10px;
            position: absolute;
            top: -8px;
            right: -12px;
        }
        
        .cart-icon {
            position: relative;
        }
        
        /* ============ MOBILE BOTTOM NAVBAR ============ */
        .mobile-bottom-nav {
            display: none;
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            box-shadow: 0 -2px 20px rgba(0, 0, 0, 0.15);
            z-index: 1000;
            padding: 8px 0;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
        }
        
        .mobile-nav-items {
            display: flex;
            justify-content: space-around;
            align-items: center;
            list-style: none;
            margin: 0;
            padding: 0;
        }
        
        .mobile-nav-items li {
            flex: 1;
            text-align: center;
        }
        
        .mobile-nav-items li a {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            text-decoration: none;
            color: rgba(255, 255, 255, 0.7);
            font-size: 12px;
            transition: all 0.3s ease;
            padding: 8px 5px;
        }
        
        .mobile-nav-items li a i {
            font-size: 22px;
        }
        
        .mobile-nav-items li a span {
            font-size: 11px;
        }
        
        .mobile-nav-items li a:hover,
        .mobile-nav-items li a.active {
            color: #ffd700;
            background: rgba(255, 215, 0, 0.1);
            border-radius: 12px;
        }
        
        .mobile-cart-badge {
            position: absolute;
            top: 0;
            right: 50%;
            transform: translateX(50%);
            background: #dc3545;
            color: white;
            border-radius: 50%;
            padding: 2px 6px;
            font-size: 10px;
            min-width: 18px;
        }

        /* Responsive Breakpoints */
        @media (max-width: 768px) {
            .desktop-navbar { display: none; }
            .mobile-bottom-nav { display: block; }
            body { padding-bottom: 70px; }
            .page-header { padding-top: 50px !important; }
        }
        @media (min-width: 769px) {
            .desktop-navbar { display: block; }
            .mobile-bottom-nav { display: none; }
            .page-header { padding-top: 130px !important; }
        }

        /* Scrollbar Styling */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: #1a1a2e; }
        ::-webkit-scrollbar-thumb { background: #ffd700; border-radius: 5px; }

        .page-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 60px 0;
            color: white;
            text-align: center;
        }

        .product-card {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            transition: all 0.3s;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.05);
            margin-bottom: 0;
            height: 100%;
            display: flex;
            flex-direction: column;
        }
        .product-card:hover { transform: translateY(-10px); box-shadow: 0 15px 40px rgba(0, 0, 0, 0.15); }
        .product-card img { width: 100%; height: 250px; object-fit: cover; }
        .product-card .price { font-size: 1.5rem; font-weight: 700; color: #667eea; }
        .product-card .mrp { text-decoration: line-through; color: #999; font-size: 0.9rem; margin-left: 10px; }
        .btn-add-cart {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 25px;
            font-weight: 600;
            transition: all 0.3s ease;
            width: 100%;
            margin-top: 5px;
            margin-bottom: 0;
        }
        .btn-add-cart:hover { transform: scale(1.05); box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4); }
        .product-card .p-3 { padding: 12px !important; flex-grow: 1; display: flex; flex-direction: column; }
        .product-card h5 { margin-bottom: 8px; font-size: 1.1rem; }
        .row>[class*="col-"] { margin-bottom: 25px; }

        .footer {
            background: #1a1a2e;
            color: white;
            padding: 50px 0 20px;
            margin-top: 50px;
        }
        .footer a { color: #ffd700; text-decoration: none; }
        .loading-spinner { text-align: center; padding: 50px; }
    </style>
</head>

<body>

    <!-- ============ DESKTOP NAVBAR (TOP) ============ -->
    <nav class="desktop-navbar">
        <div class="container">
            <a href="index.html" class="logo">
                <img src="img/site-logo.jpg" alt="Logo">
                <span class="logo-text">PEOPLE PLUS NETWORK</span>
            </a>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="products.html" class="active">Products</a></li>
                <li><a href="about.html">About</a></li>
                <li>
                    <a href="cart.html" class="cart-icon">
                        <i class="fas fa-shopping-cart"></i> Cart
                        <span class="cart-badge" id="desktopCartCount">0</span>
                    </a>
                </li>
                <li><a href="register.html" class="btn-register" id="btnJoinNow"><i class="fas fa-user-plus"></i> Join Now</a></li>
            </ul>
        </div>
    </nav>

    <!-- ============ MOBILE BOTTOM NAVBAR ============ -->
    <nav class="mobile-bottom-nav">
        <ul class="mobile-nav-items">
            <li>
                <a href="index.html">
                    <i class="fas fa-home"></i>
                    <span>Home</span>
                </a>
            </li>
            <li>
                <a href="products.html" class="active">
                    <i class="fas fa-box"></i>
                    <span>Products</span>
                </a>
            </li>
            <li>
                <a href="about.html">
                    <i class="fas fa-info-circle"></i>
                    <span>About</span>
                </a>
            </li>
            <li>
                <a href="cart.html" style="position: relative;">
                    <i class="fas fa-shopping-cart"></i>
                    <span>Cart</span>
                    <span class="mobile-cart-badge" id="mobileCartCount">0</span>
                </a>
            </li>
            <li>
                <a href="register.html" id="btnJoinNowMobile">
                    <i class="fas fa-user-plus"></i>
                    <span>Join</span>
                </a>
            </li>
        </ul>
    </nav>

    <section class="page-header">
        <div class="container">
            <h1 class="fw-bold">OUR PRODUCTS</h1>
            <p class="lead">High quality products for better life</p>
        </div>
    </section>

    <section class="container my-5">
        <div class="row" id="productsContainer">
            <div class="col-12 text-center">
                <div class="loading-spinner">
                    <i class="fas fa-spinner fa-spin fa-3x text-primary"></i>
                    <p class="mt-3">Loading products...</p>
                </div>
            </div>
        </div>
    </section>

    <footer class="footer">
        <div class="container text-center">
            <p>&copy; 2024 People Plus Network. All rights reserved.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module">
        import { getAllProducts } from './js/firebase-config.js';
        
        console.log("Firebase module loaded");
        
        // Update cart count function
        function updateCartCount() {
            let cart = JSON.parse(localStorage.getItem('cart')) || [];
            let count = cart.reduce((sum, item) => sum + (item.quantity || 1), 0);
            
            const desktopBadge = document.getElementById('desktopCartCount');
            const mobileBadge = document.getElementById('mobileCartCount');
            const oldBadge = document.getElementById('cartCount');
            
            if (desktopBadge) desktopBadge.innerText = count;
            if (mobileBadge) mobileBadge.innerText = count;
            if (oldBadge) oldBadge.innerText = count;
        }

        // Set active link
        function setActiveLink() {
            const currentPath = window.location.pathname;
            const currentPage = currentPath.split('/').pop() || 'index.html';
            
            document.querySelectorAll('.nav-links li a, .mobile-nav-items li a').forEach(link => {
                const href = link.getAttribute('href');
                if (href === currentPage) {
                    link.classList.add('active');
                } else {
                    link.classList.remove('active');
                }
            });
        }
        
        window.addToCart = function(product) {
            let cart = JSON.parse(localStorage.getItem('cart')) || [];
            const existing = cart.find(item => item.id === product.id);
            if (existing) {
                existing.quantity = (existing.quantity || 1) + 1;
            } else {
                cart.push({ ...product, quantity: 1 });
            }
            localStorage.setItem('cart', JSON.stringify(cart));
            updateCartCount();
            alert(product.name + " added to cart!");
        };
        
        async function displayProducts() {
            const container = document.getElementById('productsContainer');
            const statusText = container.querySelector('p');
            
            const setStatus = (msg) => {
                if (statusText) statusText.innerText = msg;
                console.log(msg);
            };

            setStatus("Connecting to server...");
            
            try {
                const isLocal = window.location.hostname === 'localhost' || 
                               window.location.hostname === '127.0.0.1' || 
                               !window.location.hostname || 
                               window.location.protocol === 'file:';
                
                const apiBase = isLocal ? 'http://localhost:5000/api' : '/api';
                
                let products = null;
                
                // Try Backend with Timeout
                try {
                    const controller = new AbortController();
                    const timeoutId = setTimeout(() => controller.abort(), 3000); // 3 sec timeout
                    
                    const response = await fetch(`${apiBase}/products`, {
                        method: 'GET',
                        mode: 'cors',
                        signal: controller.signal
                    });
                    
                    clearTimeout(timeoutId);
                    
                    if (response.ok) {
                        products = await response.json();
                        setStatus("Products loaded from server.");
                    }
                } catch (e) {
                    console.warn("Backend fetch failed:", e.message);
                }
                
                // Try Firebase Fallback
                if (!products || products.length === 0) {
                    setStatus("Server unreachable. Loading from Firebase...");
                    
                    // Add timeout for Firebase too
                    const firebasePromise = getAllProducts();
                    const timeoutPromise = new Promise((_, reject) => 
                        setTimeout(() => reject(new Error("Firebase timeout")), 8000)
                    );
                    
                    products = await Promise.race([firebasePromise, timeoutPromise]);
                }
                
                if (!products || products.length === 0) {
                    container.innerHTML = `
                        <div class="col-12 text-center py-5">
                            <i class="fas fa-box-open fa-3x mb-3 text-muted"></i>
                            <p class="text-muted">No products found in database.</p>
                            <button class="btn btn-primary btn-sm" onclick="location.reload()">Retry</button>
                        </div>`;
                    return;
                }
                
                container.innerHTML = products.map((product, index) => {
                    let imageUrl = product.image || '';
                    if (imageUrl.includes('via.placeholder.com') || !imageUrl.startsWith('http')) {
                        imageUrl = `https://picsum.photos/300/250?random=${product.id || index}`;
                    }
                    
                    return `
                        <div class="col-lg-3 col-md-4 col-sm-6">
                            <div class="product-card">
                                <img src="${imageUrl}" alt="${product.name}" onerror="this.src='https://picsum.photos/300/250?random=${Date.now()}'">
                                <div class="p-3">
                                    <h5>${product.name}</h5>
                                    <p class="price">₹${product.price} <span class="mrp">₹${product.mrp}</span></p>
                                    <button class="btn-add-cart" onclick='addToCart(${JSON.stringify(product).replace(/'/g, "\\'")})'>
                                        <i class="fas fa-shopping-cart"></i> Add to Cart
                                    </button>
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');
            } catch (error) {
                console.error('Final error:', error);
                container.innerHTML = `
                    <div class="col-12 text-center py-5">
                        <i class="fas fa-exclamation-triangle fa-3x mb-3 text-danger"></i>
                        <p class="text-danger">Failed to load products: ${error.message}</p>
                        <p class="small text-muted">Check if you are connected to the internet.</p>
                        <button class="btn btn-outline-danger btn-sm" onclick="location.reload()">Try Again</button>
                    </div>`;
            }
        }
        
        function updateNavbarForUser() {
            const currentUser = JSON.parse(localStorage.getItem('currentUser'));
            const btnJoinNow = document.getElementById('btnJoinNow');
            const btnJoinNowMobile = document.getElementById('btnJoinNowMobile');
            
            if (currentUser) {
                const userName = (currentUser.name || 'User').split(' ')[0];
                
                // Show Admin link if user is admin
                if (currentUser.role === 'admin') {
                    const navLinks = document.querySelector('.nav-links');
                    if (navLinks && !document.getElementById('adminLink')) {
                        const adminLi = document.createElement('li');
                        adminLi.id = 'adminLink';
                        adminLi.innerHTML = '<a href="admin.html" style="color: #ffd700;"><i class="fas fa-user-shield"></i> Admin</a>';
                        navLinks.insertBefore(adminLi, navLinks.lastElementChild);
                    }
                }

                if (btnJoinNow) {
                    btnJoinNow.innerHTML = `<i class="fas fa-user"></i> ${userName}`;
                    btnJoinNow.href = 'user-dashboard.html';
                }
                if (btnJoinNowMobile) {
                    btnJoinNowMobile.innerHTML = `<i class="fas fa-user-circle"></i> <span>Dashboard</span>`;
                    btnJoinNowMobile.href = 'user-dashboard.html';
                }
            }
        }
        
        window.logoutUser = function() {
            if (confirm('Are you sure you want to logout?')) {
                localStorage.clear();
                window.location.href = 'index.html';
            }
        };
        
        displayProducts();
        updateCartCount();
        setActiveLink();
        updateNavbarForUser();
    
    window.updateCartCount = updateCartCount;
    window.displayProducts = displayProducts;
    window.updateNavbarForUser = updateNavbarForUser;

</html>
