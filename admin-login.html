<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - People Plus Network</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .admin-login-card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 450px;
            width: 100%;
            overflow: hidden;
        }
        .admin-login-header {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: white;
            padding: 40px;
            text-align: center;
        }
        .btn-admin-login {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-weight: 600;
            width: 100%;
            transition: all 0.3s ease;
        }
        .form-control { border-radius: 10px; padding: 12px 15px; }
    </style>
    <link rel="stylesheet" href="style.css">\n</head>
<body>

<div class="admin-login-card">
    <div class="admin-login-header">
        <i class="fas fa-crown fa-3x mb-3"></i>
        <h3>Admin Panel</h3>
        <p class="mb-0">People Plus Network</p>
    </div>
    <div class="admin-login-body p-4">
        <form onsubmit="adminLogin(event)">
            <div class="mb-3">
                <label class="form-label">Admin Email</label>
                <input type="email" class="form-control" id="adminEmail" placeholder="admin@peopleplus.com" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" class="form-control" id="adminPassword" placeholder="Enter password" required>
            </div>
            <button type="submit" class="btn-admin-login">
                <i class="fas fa-sign-in-alt"></i> Login to Admin Panel
            </button>
        </form>
        <div class="text-center mt-3">
            <a href="index.html" class="text-decoration-none text-dark"><i class="fas fa-arrow-left"></i> Back to Website</a>
        </div>
    </div>
</div>

<script>
    async function adminLogin(event) {
        event.preventDefault();
        const email = document.getElementById('adminEmail').value;
        const password = document.getElementById('adminPassword').value;
        
        try {
            const response = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });
            const data = await response.json();

            if (data.success && data.user.role === 'admin') {
                alert('Login Successful!');
                window.location.href = 'admin.html';
            } else {
                alert(data.error || 'Login failed! Check credentials.');
            }
        } catch (err) {
            alert('Server error occurred');
        }
    }
</script>
    <script src="auth-check.js"></script>
</body>
</html>
