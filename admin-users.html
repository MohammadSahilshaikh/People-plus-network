<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Users</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Poppins', sans-serif; background: #f4f6f9; }
        
        .admin-sidebar {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: white;
            position: fixed;
            left: 0;
            top: 0;
            width: 260px;
            transition: all 0.3s;
            z-index: 1000;
        }
        .admin-sidebar .brand {
            padding: 25px;
            text-align: center;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .admin-sidebar .brand img {
            height: 50px;
            border-radius: 8px;
            margin-bottom: 10px;
            background: white;
            padding: 2px;
        }
        .admin-sidebar .brand h3 {
            font-size: 1.3rem;
            margin-bottom: 0;
        }
        .admin-sidebar .nav-link {
            color: rgba(255,255,255,0.7);
            padding: 12px 25px;
            margin: 5px 0;
            border-radius: 10px;
            text-decoration: none;
            display: block;
        }
        .admin-sidebar .nav-link:hover,
        .admin-sidebar .nav-link.active {
            background: rgba(255,255,255,0.1);
            color: white;
        }
        .admin-sidebar .nav-link i {
            width: 25px;
            margin-right: 10px;
        }
        
        .admin-content {
            margin-left: 260px;
            padding: 20px;
        }
        .admin-header {
            background: white;
            padding: 15px 20px;
            border-radius: 10px;
            margin-bottom: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .user-table {
            background: white;
            border-radius: 15px;
            padding: 20px;
        }
        .sidebar-toggle {
            display: none;
        }
        .btn-sm {
            margin: 2px;
        }
        
        @media (max-width: 768px) {
            .admin-sidebar {
                transform: translateX(-100%);
            }
            .admin-sidebar.show {
                transform: translateX(0);
            }
            .admin-content {
                margin-left: 0;
            }
            .sidebar-toggle {
                display: block;
            }
        }
    </style>
</head>
<body>

<!-- Admin Sidebar -->
<div class="admin-sidebar" id="adminSidebar">
    <div class="brand">
        <img src="img/site-logo.jpg" alt="Logo">
        <h3 class="text-white">PeoplePlus</h3>
        <small class="opacity-75">Admin Panel</small>
    </div>
    <nav class="nav flex-column">
        <a class="nav-link" href="admin.html"><i class="fas fa-tachometer-alt"></i> Dashboard</a>
        <a class="nav-link active" href="admin-users.html"><i class="fas fa-users"></i> Users</a>
        <a class="nav-link" href="admin-products.html"><i class="fas fa-box"></i> Products</a>
        <a class="nav-link" href="admin-orders.html"><i class="fas fa-shopping-cart"></i> Orders</a>
        <a class="nav-link" href="admin-withdrawals.html"><i class="fas fa-money-bill-wave"></i> Withdrawals</a>
        <hr class="bg-light">
        <a class="nav-link" href="index.html"><i class="fas fa-globe"></i> View Website</a>
        <a class="nav-link" href="#" onclick="logoutUser()"><i class="fas fa-sign-out-alt"></i> Logout</a>
    </nav>
</div>

<!-- Main Content -->
<div class="admin-content">
    <div class="admin-header">
        <div>
            <button class="btn btn-sm btn-outline-primary sidebar-toggle me-2" onclick="toggleSidebar()">
                <i class="fas fa-bars"></i>
            </button>
            <h4 class="mb-0 d-inline-block">User Management</h4>
        </div>
        <div class="input-group w-50">
            <input type="text" class="form-control" placeholder="Search users..." id="searchInput">
            <button class="btn btn-primary" onclick="searchUsers()"><i class="fas fa-search"></i></button>
        </div>
    </div>
    
    <div class="user-table">
        <div class="table-responsive">
            <table class="table table-hover">
                <thead>
                    <tr><th>ID</th><th>Name</th><th>Email</th><th>Phone</th><th>Sponsor ID</th><th>Join Date</th><th>Status</th><th>Actions</th></tr>
                </thead>
                <tbody id="usersTableBody">
                    <tr><td colspan="8" class="text-center">Loading...<\/td><\/tr>
                </tbody>
            </table>
        </div>
        <nav><ul class="pagination justify-content-center" id="pagination"></ul></nav>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js"></script>
<script src="js/firebase-config.js"></script>
<script>
    // Admin authentication check
    const currentUser = JSON.parse(localStorage.getItem('currentUser'));
    const adminLoggedIn = localStorage.getItem('adminLoggedIn') === 'true';
    
    if (!adminLoggedIn && (!currentUser || currentUser.role !== 'admin')) {
        window.location.href = 'register.html';
    }
    
    let allUsers = [];
    let filteredUsers = [];
    let currentPage = 1;
    const rowsPerPage = 10;
    
    function toggleSidebar() {
        document.getElementById('adminSidebar').classList.toggle('show');
    }
    
    function logoutUser() {
        if (confirm('Are you sure you want to logout?')) {
            localStorage.removeItem('adminLoggedIn');
            localStorage.removeItem('adminEmail');
            localStorage.removeItem('currentUser');
            window.location.href = 'index.html';
        }
    }
    
    async function loadUsers() {
        // Load users from Firebase
        allUsers = await window.firebaseAPI.getAllUsers();
        
        if (allUsers.length === 0) {
            // Sample users if empty
            allUsers = [
                { userId: 'PPN10001', name: 'Mohammad Sahil', email: 'sahilfact549@gmail.com', phone: '09263602455', sponsor: 'PPN0001', joined: new Date().toISOString(), status: 'active' },
                { userId: 'PPN10002', name: 'Rajesh Kumar', email: 'rajesh@email.com', phone: '9876543210', sponsor: 'PPN10001', joined: new Date().toISOString(), status: 'active' }
            ];
        }
        filteredUsers = [...allUsers];
        displayUsers();
    }
    
    function displayUsers() {
        const start = (currentPage - 1) * rowsPerPage;
        const paginatedUsers = filteredUsers.slice(start, start + rowsPerPage);
        
        const tbody = document.getElementById('usersTableBody');
        if (paginatedUsers.length === 0) {
            tbody.innerHTML = '<tr><td colspan="8" class="text-center">No users found<\/td><\/tr>';
        } else {
            tbody.innerHTML = paginatedUsers.map((u, index) => `
                <tr>
                    <td>${u.userId || 'N/A'}</td>
                    <td><i class="fas fa-user-circle text-primary"></i> ${u.name || 'N/A'}</td>
                    <td>${u.email}</td>
                    <td>${u.phone || 'N/A'}</td>
                    <td>${u.sponsor || 'N/A'}</td>
                    <td>${u.joined ? new Date(u.joined).toLocaleDateString() : 'N/A'}</td>
                    <td><span class="badge bg-${u.status === 'active' ? 'success' : 'danger'}">${u.status === 'active' ? 'Active' : 'Blocked'}</span></td>
                    <td>
                        <button class="btn btn-sm btn-${u.status === 'active' ? 'warning' : 'success'}" onclick="toggleUserStatus('${u.id}', '${u.status}')" title="${u.status === 'active' ? 'Block User' : 'Unblock User'}">
                            <i class="fas fa-${u.status === 'active' ? 'ban' : 'check'}"></i>
                        </button>
                        <button class="btn btn-sm btn-danger" onclick="deleteUser('${u.id}', '${u.email}')" title="Delete User">
                            <i class="fas fa-trash"></i>
                        </button>
                    </td>
                </tr>
            `).join('');
        }
        
        const totalPages = Math.ceil(filteredUsers.length / rowsPerPage);
        const pagination = document.getElementById('pagination');
        if (totalPages > 1) {
            let html = '';
            for (let i = 1; i <= totalPages; i++) {
                html += `<li class="page-item ${i === currentPage ? 'active' : ''}"><a class="page-link" href="#" onclick="changePage(${i}); return false;">${i}</a></li>`;
            }
            pagination.innerHTML = html;
        } else {
            pagination.innerHTML = '';
        }
    }
    
    function changePage(page) {
        currentPage = page;
        displayUsers();
    }
    
    function searchUsers() {
        const term = document.getElementById('searchInput').value.toLowerCase();
        filteredUsers = allUsers.filter(u => 
            (u.name && u.name.toLowerCase().includes(term)) ||
            (u.email && u.email.toLowerCase().includes(term)) ||
            (u.phone && u.phone.includes(term))
        );
        currentPage = 1;
        displayUsers();
    }
    
    // Toggle user status (Active/Block)
    async function toggleUserStatus(userId, currentStatus) {
        const newStatus = currentStatus === 'active' ? 'blocked' : 'active';
        const result = await window.firebaseAPI.updateUserStatus(userId, newStatus);
        
        if (result.success) {
            alert(`User status updated to ${newStatus === 'active' ? 'ACTIVE' : 'BLOCKED'}`);
            loadUsers();
            
            // Update currentUser if it's the same user
            const currentUserData = JSON.parse(localStorage.getItem('currentUser'));
            if (currentUserData && currentUserData.id === userId) {
                currentUserData.status = newStatus;
                localStorage.setItem('currentUser', JSON.stringify(currentUserData));
            }
        } else {
            alert('Failed to update user status: ' + result.error);
        }
    }
    
    // Delete user permanently
    async function deleteUser(userId, email) {
        if (confirm('Are you sure you want to DELETE this user permanently? This action cannot be undone!')) {
            if (email === 'admin@peopleplus.com') {
                alert('Cannot delete the main admin account!');
                return;
            }
            
            const result = await window.firebaseAPI.deleteUser(userId);
            if (result.success) {
                alert('User deleted successfully!');
                loadUsers();
            } else {
                alert('Failed to delete user: ' + result.error);
            }
        }
    }
    
    loadUsers();
</script>
</body>
</html>
