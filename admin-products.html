<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Products</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Cloudinary Widget Script -->
    <script src="https://upload-widget.cloudinary.com/global/all.js" type="text/javascript"></script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Poppins', sans-serif; background: #f4f6f9; }
        
        .admin-sidebar {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: white;
            position: fixed;
            left: 0;
            top: 0;
            width: 260px;
            transition: all 0.3s;
            z-index: 1000;
        }
        .admin-sidebar .brand {
            padding: 25px;
            text-align: center;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .admin-sidebar .brand img {
            height: 50px;
            border-radius: 8px;
            margin-bottom: 10px;
            background: white;
            padding: 2px;
        }
        .admin-sidebar .brand h3 {
            font-size: 1.3rem;
            margin-bottom: 0;
        }
        .admin-sidebar .nav-link {
            color: rgba(255,255,255,0.7);
            padding: 12px 25px;
            margin: 5px 0;
            border-radius: 10px;
            text-decoration: none;
            display: block;
        }
        .admin-sidebar .nav-link:hover,
        .admin-sidebar .nav-link.active {
            background: rgba(255,255,255,0.1);
            color: white;
        }
        .admin-sidebar .nav-link i {
            width: 25px;
            margin-right: 10px;
        }
        
        .admin-content {
            margin-left: 260px;
            padding: 20px;
        }
        .admin-header {
            background: white;
            padding: 15px 20px;
            border-radius: 10px;
            margin-bottom: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .product-table {
            background: white;
            border-radius: 15px;
            padding: 20px;
        }
        .btn-add {
            background: linear-gradient(135deg, #28a745, #20c997);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
        }
        .sidebar-toggle {
            display: none;
        }
        #imagePreview {
            width: 100px;
            height: 100px;
            object-fit: cover;
            border-radius: 10px;
            margin-top: 10px;
            border: 1px solid #ddd;
            padding: 5px;
        }
        
        @media (max-width: 768px) {
            .admin-sidebar {
                transform: translateX(-100%);
            }
            .admin-sidebar.show {
                transform: translateX(0);
            }
            .admin-content {
                margin-left: 0;
            }
            .sidebar-toggle {
                display: block;
            }
        }
    </style>
</head>
<body>

<!-- Admin Sidebar -->
<div class="admin-sidebar" id="adminSidebar">
    <div class="brand">
        <img src="img/site-logo.jpg" alt="Logo">
        <h3 class="text-white">PeoplePlus</h3>
        <small class="opacity-75">Admin Panel</small>
    </div>
    <nav class="nav flex-column">
        <a class="nav-link" href="admin.html"><i class="fas fa-tachometer-alt"></i> Dashboard</a>
        <a class="nav-link" href="admin-users.html"><i class="fas fa-users"></i> Users</a>
        <a class="nav-link active" href="admin-products.html"><i class="fas fa-box"></i> Products</a>
        <a class="nav-link" href="admin-orders.html"><i class="fas fa-shopping-cart"></i> Orders</a>
        <a class="nav-link" href="admin-withdrawals.html"><i class="fas fa-money-bill-wave"></i> Withdrawals</a>
        <hr class="bg-light">
        <a class="nav-link" href="index.html"><i class="fas fa-globe"></i> View Website</a>
        <a class="nav-link" href="#" onclick="logoutUser()"><i class="fas fa-sign-out-alt"></i> Logout</a>
    </nav>
</div>

<!-- Main Content -->
<div class="admin-content">
    <div class="admin-header">
        <div>
            <button class="btn btn-sm btn-outline-primary sidebar-toggle me-2" onclick="toggleSidebar()">
                <i class="fas fa-bars"></i>
            </button>
            <h4 class="mb-0 d-inline-block">Product Management</h4>
        </div>
        <button class="btn-add" data-bs-toggle="modal" data-bs-target="#addProductModal">
            <i class="fas fa-plus"></i> Add Product
        </button>
    </div>
    
    <div class="product-table">
        <div class="table-responsive">
            <table class="table table-hover">
                <thead>
                    <tr><th>ID</th><th>Image</th><th>Name</th><th>Price</th><th>MRP</th><th>Stock</th><th>Actions</th></tr>
                </thead>
                <tbody id="productsTableBody">
                    <tr><td colspan="7" class="text-center">Loading...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Add Product Modal -->
<div class="modal fade" id="addProductModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5>Add New Product</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="addProductForm">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label>Product Name *</label>
                            <input type="text" class="form-control" id="productName" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label>Stock *</label>
                            <input type="number" class="form-control" id="productStock" value="100" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label>Price (₹) *</label>
                            <input type="number" class="form-control" id="productPrice" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label>MRP (₹) *</label>
                            <input type="number" class="form-control" id="productMrp" required>
                        </div>
                        <div class="col-12 mb-3">
                            <label>Product Image</label>
                            <div class="input-group">
                                <input type="text" class="form-control" id="productImage" placeholder="Image URL will appear here" readonly>
                                <button class="btn btn-primary" type="button" onclick="openCloudinaryWidget()">
                                    <i class="fas fa-cloud-upload-alt"></i> Upload Image
                                </button>
                            </div>
                            <img id="imagePreview" src="" style="display: none; margin-top: 10px; border-radius: 10px;">
                        </div>
                        <div class="col-12 mb-3">
                            <label>Description</label>
                            <textarea class="form-control" id="productDesc" rows="3" placeholder="Product description"></textarea>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Save Product</button>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
<script type="module">
    import { API_URL } from './js/firebase-config.js';
    
    // Cloudinary configuration
    const cloudName = 'sahilfact549'; // Updated to sahilfact549
    const uploadPreset = 'ml_default'; // Standard preset
    
    // Admin authentication check
    const currentUser = JSON.parse(localStorage.getItem('currentUser'));
    if (!currentUser || currentUser.role !== 'admin') {
        window.location.href = 'register.html';
    }
    
    let products = [];
    const isLocal = window.location.hostname === 'localhost' || 
                   window.location.hostname === '127.0.0.1' || 
                   !window.location.hostname || 
                   window.location.protocol === 'file:';
                   
    const API_BASE = isLocal ? 'http://localhost:5000/api' : '/api';
    let uploadedImageUrl = '';
    
    function toggleSidebar() {
        document.getElementById('adminSidebar').classList.toggle('show');
    }
    
    window.logoutUser = function() {
        if (confirm('Are you sure you want to logout?')) {
            localStorage.clear();
            window.location.href = 'index.html';
        }
    };

    async function getAuthToken() {
        try {
            const { auth } = await import('./js/firebase-config.js');
            // Wait for auth to initialize
            if (auth.currentUser === undefined) {
                await new Promise(resolve => {
                    const unsubscribe = auth.onAuthStateChanged(user => {
                        unsubscribe();
                        resolve(user);
                    });
                });
            }
            if (auth.currentUser) {
                return await auth.currentUser.getIdToken();
            }
            // If still no user, check localStorage as last resort (though ID token needs actual auth)
            return 'dummy-token'; 
        } catch (e) {
            console.error('Token error:', e);
            return 'dummy-token';
        }
    }
    
    async function loadProducts() {
        const tbody = document.getElementById('productsTableBody');
        tbody.innerHTML = '<tr><td colspan="7" class="text-center"><i class="fas fa-spinner fa-spin"></i> Loading...</td></tr>';
        
        try {
            const token = await getAuthToken();
            const response = await fetch(`${API_BASE}/products/all`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            if (!response.ok) throw new Error('Failed to fetch');
            products = await response.json();
            displayProducts();
        } catch (error) {
            console.error('Error loading products:', error);
            // Fallback to public products if /all fails
            try {
                const response = await fetch(`${API_BASE}/products`);
                products = await response.json();
                displayProducts();
            } catch (e) {
                tbody.innerHTML = '<tr><td colspan="7" class="text-center text-danger">Error loading products from backend. Please ensure the server is running on port 5000.</td></tr>';
            }
        }
    }
    
    function displayProducts() {
        const tbody = document.getElementById('productsTableBody');
        if (!products || products.length === 0) {
            tbody.innerHTML = '<tr><td colspan="7" class="text-center">No products found</td></tr>';
        } else {
            tbody.innerHTML = products.map(p => `
                <tr>
                    <td>${p.id ? p.id.substring(0, 8) : 'N/A'}</td>
                    <td><img src="${p.image}" width="50" height="50" class="rounded" style="object-fit: cover;" onerror="this.src='https://picsum.photos/50/50'"></td>
                    <td><strong>${p.name}</strong><br><small class="text-muted">${p.desc ? p.desc.substring(0, 50) : ''}</small></td>
                    <td>₹${p.price}</td>
                    <td><span class="text-muted">₹${p.mrp}</span></td>
                    <td>${p.stock || 0}</td>
                    <td>
                        <button class="btn btn-sm btn-danger" onclick="deleteProductHandler('${p.id}')" title="Delete Product">
                            <i class="fas fa-trash"></i> Delete
                        </button>
                    </td>
                </tr>
            `).join('');
        }
    }
    
    // Open Cloudinary Upload Widget
    window.openCloudinaryWidget = function() {
        const widget = cloudinary.createUploadWidget(
            {
                cloudName: cloudName,
                uploadPreset: uploadPreset,
                sources: ['local', 'camera', 'url'],
                multiple: false,
                cropping: true,
                croppingAspectRatio: 1,
                folder: 'peopleplus/products',
                clientAllowedFormats: ['images', 'jpg', 'jpeg', 'png', 'webp']
            },
            (error, result) => {
                if (!error && result && result.event === 'success') {
                    uploadedImageUrl = result.info.secure_url;
                    document.getElementById('productImage').value = uploadedImageUrl;
                    const preview = document.getElementById('imagePreview');
                    preview.src = uploadedImageUrl;
                    preview.style.display = 'block';
                    alert('✅ Image uploaded successfully!');
                } else if (error) {
                    console.error('Cloudinary error:', error);
                    alert('❌ Upload failed. Using a placeholder image instead.');
                    // Fallback to a placeholder
                    const dummyImg = `https://picsum.photos/300/250?random=${Date.now()}`;
                    document.getElementById('productImage').value = dummyImg;
                    document.getElementById('imagePreview').src = dummyImg;
                    document.getElementById('imagePreview').style.display = 'block';
                }
            }
        );
        widget.open();
    };
    
    // Add Product Form Submit
    document.getElementById('addProductForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const productName = document.getElementById('productName').value.trim();
        if (!productName) { alert('Please enter product name'); return; }
        
        const newProduct = {
            name: productName,
            price: parseInt(document.getElementById('productPrice').value),
            mrp: parseInt(document.getElementById('productMrp').value),
            stock: parseInt(document.getElementById('productStock').value),
            image: document.getElementById('productImage').value || 'https://picsum.photos/300/250',
            desc: document.getElementById('productDesc').value || '',
            status: 'active'
        };
        
        const btn = e.target.querySelector('button[type="submit"]');
        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Saving...';

        try {
            const token = await getAuthToken();
            const response = await fetch(`${API_BASE}/products`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify(newProduct)
            });
            
            const result = await response.json();
            
            if (response.ok) {
                alert('✅ Product added successfully via Backend!');
                bootstrap.Modal.getInstance(document.getElementById('addProductModal')).hide();
                document.getElementById('addProductForm').reset();
                document.getElementById('imagePreview').style.display = 'none';
                uploadedImageUrl = '';
                loadProducts();
            } else {
                throw new Error(result.error || 'Failed to save product');
            }
        } catch (error) {
            alert('❌ Failed to add product: ' + error.message);
        } finally {
            btn.disabled = false;
            btn.innerHTML = 'Save Product';
        }
    });
    
    window.deleteProductHandler = async function(productId) {
        if (confirm('Delete this product permanently?')) {
            try {
                const token = await getAuthToken();
                const response = await fetch(`${API_BASE}/products/${productId}`, {
                    method: 'DELETE',
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });
                
                if (response.ok) {
                    alert('✅ Product deleted successfully!');
                    loadProducts();
                } else {
                    const result = await response.json();
                    throw new Error(result.error || 'Delete failed');
                }
            } catch (error) {
                alert('❌ Failed to delete product: ' + error.message);
            }
        }
    };
    
    loadProducts();
    window.toggleSidebar = toggleSidebar;
</script>
</body>
</html>
