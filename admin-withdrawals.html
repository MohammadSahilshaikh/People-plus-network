<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Admin - Withdrawals</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Poppins', sans-serif; background: #f4f6f9; }
        
        .admin-sidebar {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: white;
            position: fixed;
            left: 0;
            top: 0;
            width: 260px;
            transition: all 0.3s;
            z-index: 1000;
        }
        .admin-sidebar .brand {
            padding: 25px;
            text-align: center;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .admin-sidebar .brand img {
            height: 50px;
            border-radius: 8px;
            margin-bottom: 10px;
            background: white;
            padding: 2px;
        }
        .admin-sidebar .brand h3 {
            font-size: 1.3rem;
            margin-bottom: 0;
        }
        .admin-sidebar .nav-link {
            color: rgba(255,255,255,0.7);
            padding: 12px 25px;
            margin: 5px 0;
            border-radius: 10px;
            text-decoration: none;
            display: block;
            font-size: 14px;
        }
        .admin-sidebar .nav-link:hover,
        .admin-sidebar .nav-link.active {
            background: rgba(255,255,255,0.1);
            color: white;
        }
        .admin-sidebar .nav-link i {
            width: 25px;
            margin-right: 10px;
        }
        
        .admin-content {
            margin-left: 260px;
            padding: 20px;
        }
        .admin-header {
            background: white;
            padding: 15px 20px;
            border-radius: 10px;
            margin-bottom: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .withdrawal-table {
            background: white;
            border-radius: 15px;
            padding: 20px;
        }
        .stat-card {
            background: white;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            text-align: center;
        }
        .sidebar-toggle {
            display: none;
        }
        
        .badge-pending { background: #ffc107; color: #333; }
        .badge-approved { background: #28a745; color: white; }
        .badge-rejected { background: #dc3545; color: white; }
        
        @media (max-width: 992px) {
            .admin-sidebar { transform: translateX(-100%); }
            .admin-sidebar.show { transform: translateX(0); }
            .admin-content { margin-left: 0; }
            .sidebar-toggle { display: block; }
        }
        
        @media (max-width: 768px) {
            .admin-content { padding: 15px; }
            .withdrawal-table { padding: 15px; font-size: 12px; }
            .stat-card { padding: 15px; }
        }
        
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #667eea; border-radius: 5px; }
    </style>
</head>
<body>

<div class="admin-sidebar" id="adminSidebar">
    <div class="brand">
        <img src="img/site-logo.jpg" alt="Logo">
        <h3 class="text-white">PeoplePlus</h3>
        <small class="opacity-75">Admin Panel</small>
    </div>
    <nav class="nav flex-column">
        <a class="nav-link" href="admin.html"><i class="fas fa-tachometer-alt"></i> Dashboard</a>
        <a class="nav-link" href="admin-users.html"><i class="fas fa-users"></i> Users</a>
        <a class="nav-link" href="admin-products.html"><i class="fas fa-box"></i> Products</a>
        <a class="nav-link" href="admin-orders.html"><i class="fas fa-shopping-cart"></i> Orders</a>
        <a class="nav-link active" href="admin-withdrawals.html"><i class="fas fa-money-bill-wave"></i> Withdrawals</a>
        <hr class="bg-light">
        <a class="nav-link" href="index.html"><i class="fas fa-globe"></i> View Website</a>
        <a class="nav-link" href="#" onclick="logoutUser()"><i class="fas fa-sign-out-alt"></i> Logout</a>
    </nav>
</div>

<div class="admin-content">
    <div class="admin-header">
        <div>
            <button class="btn btn-sm btn-outline-primary sidebar-toggle me-2" onclick="toggleSidebar()">
                <i class="fas fa-bars"></i>
            </button>
            <h4 class="mb-0 d-inline-block">Withdrawal Requests</h4>
        </div>
        <div>
            <span><i class="fas fa-user-circle"></i> Admin</span>
        </div>
    </div>
    
    <div class="row g-4 mb-4">
        <div class="col-md-4 col-6">
            <div class="stat-card">
                <i class="fas fa-clock fa-2x text-warning"></i>
                <h2 id="pendingCount">0</h2>
                <p>Pending</p>
                <h5 id="pendingAmount">₹0</h5>
            </div>
        </div>
        <div class="col-md-4 col-6">
            <div class="stat-card">
                <i class="fas fa-check-circle fa-2x text-success"></i>
                <h2 id="approvedCount">0</h2>
                <p>Approved</p>
            </div>
        </div>
        <div class="col-md-4 col-6">
            <div class="stat-card">
                <i class="fas fa-rupee-sign fa-2x text-primary"></i>
                <h2 id="totalPaid">₹0</h2>
                <p>Total Paid</p>
            </div>
        </div>
    </div>
    
    <div class="withdrawal-table">
        <div class="table-responsive">
            <table class="table table-hover table-sm">
                <thead>
                    <tr><th>ID</th><th>User</th><th>Amount</th><th>Bank Details</th><th>Date</th><th>Status</th><th>Actions</th></tr>
                </thead>
                <tbody id="withdrawalsTableBody">
                    <td><td colspan="7" class="text-center">Loading...<\/td><\/tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/auth.js"></script>
<script>
    const currentUser = JSON.parse(localStorage.getItem('currentUser'));
    if (!currentUser || currentUser.role !== 'admin') {
        window.location.href = 'register.html';
    }
    
    let withdrawals = [];
    
    function toggleSidebar() {
        document.getElementById('adminSidebar').classList.toggle('show');
    }
    
    async function loadWithdrawals() {
        withdrawals = await window.firebaseAPI.getAllWithdrawals();
        updateStats();
        displayWithdrawals();
    }
    
    function updateStats() {
        const pending = withdrawals.filter(w => w.status === 'Pending');
        const approved = withdrawals.filter(w => w.status === 'Approved');
        const pendingAmount = pending.reduce((sum, w) => sum + (w.amount || 0), 0);
        const totalPaid = approved.reduce((sum, w) => sum + (w.amount || 0), 0);
        
        document.getElementById('pendingCount').innerText = pending.length;
        document.getElementById('pendingAmount').innerHTML = '₹' + pendingAmount.toLocaleString();
        document.getElementById('approvedCount').innerText = approved.length;
        document.getElementById('totalPaid').innerHTML = '₹' + totalPaid.toLocaleString();
    }
    
    function formatDate(dateString) {
        if (!dateString) return 'N/A';
        const date = new Date(dateString);
        return date.toLocaleDateString('en-IN');
    }
    
    function displayWithdrawals() {
        const tbody = document.getElementById('withdrawalsTableBody');
        if (withdrawals.length === 0) {
            tbody.innerHTML = '<tr><td colspan="7" class="text-center">No withdrawal requests found<\/td><\/tr>';
        } else {
            tbody.innerHTML = withdrawals.map(w => `
                <tr>
                    <td>#${w.id?.substring(0, 8) || 'N/A'}</td>
                    <td><strong>${w.userName || 'User'}</strong><br><small>${w.userEmail || ''}</small></td>
                    <td class="fw-bold text-warning">₹${(w.amount || 0).toLocaleString()}</td>
                    <td>${w.bankDetails || 'N/A'}<br><small>${w.fullBankDetails?.accountName || ''}</small></td>
                    <td>${formatDate(w.date)}</td>
                    <td>${w.status === 'Pending' ? '<span class="badge badge-pending">⏳ Pending</span>' : '<span class="badge badge-approved">✅ Approved</span>'}</td>
                    <td>
                        ${w.status === 'Pending' ? `
                            <button class="btn btn-sm btn-success me-1" onclick="approveWithdrawal('${w.id}', '${w.userId}', ${w.amount})">
                                <i class="fas fa-check"></i> Approve
                            </button>
                            <button class="btn btn-sm btn-danger" onclick="rejectWithdrawal('${w.id}', '${w.userId}', ${w.amount})">
                                <i class="fas fa-times"></i> Reject
                            </button>
                        ` : '<span class="text-success"><i class="fas fa-check-circle"></i> Completed</span>'}
                    </td>
                </tr>
            `).join('');
        }
    }
    
    async function approveWithdrawal(withdrawalId, userId, amount) {
        if (confirm('Approve this withdrawal request? Amount will be sent to user\'s bank account.')) {
            const result = await window.firebaseAPI.updateWithdrawalStatus(withdrawalId, 'Approved', userId, amount);
            if (result.success) {
                alert('✅ Withdrawal approved! Amount will be sent to user.');
                loadWithdrawals();
            } else {
                alert('❌ Failed: ' + result.error);
            }
        }
    }
    
    async function rejectWithdrawal(withdrawalId, userId, amount) {
        if (confirm('Reject this withdrawal request? Amount will be returned to user\'s wallet.')) {
            const result = await window.firebaseAPI.updateWithdrawalStatus(withdrawalId, 'Rejected', userId, amount);
            if (result.success) {
                alert('❌ Withdrawal rejected! Amount returned to wallet.');
                loadWithdrawals();
            } else {
                alert('❌ Failed: ' + result.error);
            }
        }
    }
    
    loadWithdrawals();
</script>
</body>
</html>
