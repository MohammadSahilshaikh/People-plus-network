<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login & Register - People Plus Network</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Poppins', sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; }
        
        /* ============ DESKTOP NAVBAR (TOP) ============ */
        .desktop-navbar {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            box-shadow: 0 2px 20px rgba(0, 0, 0, 0.1);
            padding: 1rem 0;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            transition: all 0.3s ease;
        }
        
        .desktop-navbar .container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }
        
        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
        }
        
        .logo img {
            height: 45px;
            border-radius: 8px;
            background: white;
            padding: 3px;
        }
        
        .logo-text {
            font-size: 1.3rem;
            font-weight: 800;
            color: white;
            letter-spacing: 1px;
        }
        
        .nav-links {
            display: flex;
            align-items: center;
            gap: 25px;
            list-style: none;
            margin: 0;
            padding: 0;
        }
        
        .nav-links li a {
            color: white;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s ease;
            position: relative;
            padding: 5px 0;
        }
        
        .nav-links li a:hover, .nav-links li a.active {
            color: #ffd700;
        }
        
        .nav-links li a.active::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 0;
            right: 0;
            height: 2px;
            background: #ffd700;
            border-radius: 2px;
        }
        
        .btn-register-nav {
            background: #ffd700;
            color: #333 !important;
            padding: 8px 25px !important;
            border-radius: 50px;
            font-weight: 600;
        }
        
        .btn-register-nav:hover {
            background: #ffed4a;
            transform: translateY(-2px);
        }
        
        .cart-badge {
            background: #dc3545;
            color: white;
            border-radius: 50%;
            padding: 2px 6px;
            font-size: 10px;
            position: absolute;
            top: -8px;
            right: -12px;
        }
        
        .cart-icon {
            position: relative;
        }
        
        /* ============ MOBILE BOTTOM NAVBAR ============ */
        .mobile-bottom-nav {
            display: none;
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            box-shadow: 0 -2px 20px rgba(0, 0, 0, 0.15);
            z-index: 1000;
            padding: 8px 0;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
        }
        
        .mobile-nav-items {
            display: flex;
            justify-content: space-around;
            align-items: center;
            list-style: none;
            margin: 0;
            padding: 0;
        }
        
        .mobile-nav-items li {
            flex: 1;
            text-align: center;
        }
        
        .mobile-nav-items li a {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            text-decoration: none;
            color: rgba(255, 255, 255, 0.7);
            font-size: 12px;
            transition: all 0.3s ease;
            padding: 8px 5px;
        }
        
        .mobile-nav-items li a i {
            font-size: 22px;
        }
        
        .mobile-nav-items li a span {
            font-size: 11px;
        }
        
        .mobile-nav-items li a:hover,
        .mobile-nav-items li a.active {
            color: #ffd700;
            background: rgba(255, 215, 0, 0.1);
            border-radius: 12px;
        }
        
        .mobile-cart-badge {
            position: absolute;
            top: 0;
            right: 50%;
            transform: translateX(50%);
            background: #dc3545;
            color: white;
            border-radius: 50%;
            padding: 2px 6px;
            font-size: 10px;
            min-width: 18px;
        }

        /* Responsive Breakpoints */
        @media (max-width: 768px) {
            .desktop-navbar { display: none; }
            .mobile-bottom-nav { display: block; }
            body { padding-bottom: 70px; }
            .main-container { padding-top: 50px !important; }
        }
        @media (min-width: 769px) {
            .desktop-navbar { display: block; }
            .mobile-bottom-nav { display: none; }
            .main-container { padding-top: 100px !important; }
        }

        /* Scrollbar Styling */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: #1a1a2e; }
        ::-webkit-scrollbar-thumb { background: #ffd700; border-radius: 5px; }

        .main-container { flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px 20px; }
        .auth-container { max-width: 550px; width: 100%; margin: 0 auto; }
        .auth-card { background: white; border-radius: 30px; box-shadow: 0 25px 50px rgba(0,0,0,0.2); overflow: hidden; }
        .auth-header { background: linear-gradient(135deg, #667eea, #764ba2); padding: 30px; text-align: center; color: white; }
        
        .nav-pills { 
            background: rgba(255,255,255,0.2); 
            border-radius: 50px; 
            padding: 5px; 
            max-width: 300px; 
            margin: 0 auto; 
            display: flex; 
        }
        .nav-pills .nav-link { 
            color: white !important; 
            border-radius: 50px; 
            padding: 8px 30px; 
            font-weight: 600; 
            cursor: pointer; 
            background: transparent;
            transition: all 0.3s;
        }
        .nav-pills .nav-link.active { 
            background: white !important; 
            color: #667eea !important; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.1); 
        }
        .nav-pills .nav-link:hover:not(.active) { 
            background: rgba(255,215,0,0.2) !important; 
            color: #ffd700 !important; 
        }
        
        .auth-body { padding: 35px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { font-weight: 500; margin-bottom: 8px; display: block; color: #333; }
        .form-group input { width: 100%; padding: 12px 15px; border: 1px solid #ddd; border-radius: 10px; }
        .form-group input:focus { outline: none; border-color: #667eea; box-shadow: 0 0 0 3px rgba(102,126,234,0.1); }
        
        .btn-auth { 
            background: linear-gradient(135deg, #667eea, #764ba2); 
            color: white; 
            border: none; 
            width: 100%; 
            padding: 14px; 
            border-radius: 50px; 
            font-weight: 600; 
            transition: all 0.3s; 
        }
        .btn-auth:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(102,126,234,0.4); }
        
        .home-link { text-align: center; margin-top: 25px; padding-top: 20px; border-top: 1px solid #eee; }
        .btn-back-home { 
            display: inline-flex; 
            align-items: center; 
            gap: 10px; 
            background: transparent; 
            color: #667eea; 
            padding: 12px 25px; 
            border-radius: 50px; 
            font-weight: 600; 
            text-decoration: none; 
            border: 2px solid #667eea; 
            transition: all 0.3s; 
        }
        .btn-back-home:hover { background: #667eea; color: white; }
    </style>
</head>
<body>

    <!-- ============ DESKTOP NAVBAR (TOP) ============ -->
    <nav class="desktop-navbar">
        <div class="container">
            <a href="index.html" class="logo">
                <img src="img/site-logo.jpg" alt="Logo">
                <span class="logo-text">PEOPLE PLUS NETWORK</span>
            </a>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="products.html">Products</a></li>
                <li><a href="about.html">About</a></li>
                <li>
                    <a href="cart.html" class="cart-icon">
                        <i class="fas fa-shopping-cart"></i> Cart
                        <span class="cart-badge" id="desktopCartCount">0</span>
                    </a>
                </li>
                <li><a href="register.html" class="btn-register-nav active" id="btnJoinNow"><i class="fas fa-user-plus"></i> Join Now</a></li>
            </ul>
        </div>
    </nav>

    <!-- ============ MOBILE BOTTOM NAVBAR ============ -->
    <nav class="mobile-bottom-nav">
        <ul class="mobile-nav-items">
            <li>
                <a href="index.html">
                    <i class="fas fa-home"></i>
                    <span>Home</span>
                </a>
            </li>
            <li>
                <a href="products.html">
                    <i class="fas fa-box"></i>
                    <span>Products</span>
                </a>
            </li>
            <li>
                <a href="about.html">
                    <i class="fas fa-info-circle"></i>
                    <span>About</span>
                </a>
            </li>
            <li>
                <a href="cart.html" style="position: relative;">
                    <i class="fas fa-shopping-cart"></i>
                    <span>Cart</span>
                    <span class="mobile-cart-badge" id="mobileCartCount">0</span>
                </a>
            </li>
            <li>
                <a href="register.html" class="active" id="btnJoinNowMobile">
                    <i class="fas fa-user-plus"></i>
                    <span>Join</span>
                </a>
            </li>
        </ul>
    </nav>

<div class="main-container">
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <i class="fas fa-users-cog fa-3x mb-3"></i>
                <h2>Welcome to People Plus</h2>
                <ul class="nav nav-pills" id="authTab">
                    <li class="nav-item"><button class="nav-link active" data-bs-toggle="pill" data-bs-target="#login">Login</button></li>
                    <li class="nav-item"><button class="nav-link" data-bs-toggle="pill" data-bs-target="#register">Join Now</button></li>
                </ul>
            </div>
            <div class="auth-body">
                <div class="tab-content">
                    <div class="tab-pane fade show active" id="login">
                        <form id="loginForm">
                            <div class="form-group"><label>Email Address</label><input type="email" id="loginEmail" placeholder="Enter your email" required></div>
                            <div class="form-group"><label>Password</label><input type="password" id="loginPassword" placeholder="Enter your password" required></div>
                            <button type="submit" class="btn-auth">Login Securely</button>
                        </form>
                    </div>
                    <div class="tab-pane fade" id="register">
                        <form id="registerForm">
                            <div class="form-group"><label>Full Name</label><input type="text" id="regName" placeholder="Enter your full name" required></div>
                            <div class="form-group"><label>Email Address</label><input type="email" id="regEmail" placeholder="Enter your email" required></div>
                            <div class="form-group"><label>Phone Number</label><input type="tel" id="regPhone" placeholder="10-digit mobile number" required></div>
                            <div class="form-group"><label>Password</label><input type="password" id="regPassword" placeholder="Create a strong password (min 6 characters)" required></div>
                            <div class="form-group"><label>Sponsor ID (Optional)</label><input type="text" id="regSponsor" placeholder="Enter sponsor ID if any"></div>
                            <button type="submit" class="btn-auth">Create Account</button>
                        </form>
                    </div>
                </div>
                <div class="home-link"><a href="index.html" class="btn-back-home"><i class="fas fa-arrow-left"></i> Back to Home</a></div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyDbjm0SEvm08Sl6adjeF_v3pSscbPtmTdo",
        authDomain: "people-plus-network.firebaseapp.com",
        projectId: "people-plus-network",
        storageBucket: "people-plus-network.firebasestorage.app",
        messagingSenderId: "981097644678",
        appId: "1:981097644678:web:a19be14e90e580414f0707",
        measurementId: "G-422JG8E9KM"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();

    function updateCartCount() {
        let cart = JSON.parse(localStorage.getItem('cart')) || [];
        let count = cart.reduce((sum, item) => sum + (item.quantity || 1), 0);
        let dSpan = document.getElementById('desktopCartCount');
        let mSpan = document.getElementById('mobileCartCount');
        if (dSpan) dSpan.innerText = count;
        if (mSpan) mSpan.innerText = count;
    }

    async function registerUser(userData) {
        try {
            const userCredential = await auth.createUserWithEmailAndPassword(userData.email, userData.password);
            const user = userCredential.user;
            const userId = "PPN" + Math.floor(Math.random() * 90000 + 10000);
            await db.collection("users").doc(user.uid).set({
                userId: userId, name: userData.name, email: userData.email, phone: userData.phone,
                sponsor: userData.sponsor || "PPN0001", wallet: 0, role: "user", status: "active",
                joined: new Date().toISOString()
            });
            return { success: true, user: { id: user.uid, userId: userId, name: userData.name, email: userData.email, role: "user", wallet: 0 } };
        } catch (error) {
            return { success: false, error: error.message };
        }
    }

    async function loginUser(email, password) {
        try {
            const userCredential = await auth.signInWithEmailAndPassword(email, password);
            const user = userCredential.user;
            const doc = await db.collection("users").doc(user.uid).get();
            if (!doc.exists) return { success: false, error: "User data not found" };
            return { success: true, user: { id: user.uid, ...doc.data() } };
        } catch (error) {
            return { success: false, error: error.message };
        }
    }

    async function createDefaultAdmin() {
        try {
            try {
                await auth.signInWithEmailAndPassword("admin@peopleplus.com", "admin123");
            } catch (error) {
                const userCredential = await auth.createUserWithEmailAndPassword("admin@peopleplus.com", "admin123");
                const user = userCredential.user;
                await db.collection("users").doc(user.uid).set({
                    userId: "ADMIN001", name: "Super Admin", email: "admin@peopleplus.com", phone: "9999999999",
                    role: "admin", status: "active", wallet: 0, joined: new Date().toISOString()
                });
            }
        } catch (error) {
            console.log("Admin error:", error.message);
        }
    }
    createDefaultAdmin();

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('loginEmail').value.trim();
        const password = document.getElementById('loginPassword').value;
        if (!email || !password) { alert('Please enter email and password'); return; }
        
        const btn = e.target.querySelector('button');
        const originalText = btn.innerHTML;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Logging in...';
        btn.disabled = true;
        
        try {
            const result = await loginUser(email, password);
            if (result.success) {
                localStorage.setItem('currentUser', JSON.stringify(result.user));
                if (result.user.role === 'admin') {
                    window.location.href = 'admin.html';
                } else {
                    window.location.href = 'user-profile.html';
                }
            } else {
                alert('❌ Login failed: ' + result.error);
            }
        } catch (error) {
            alert('❌ Error: ' + error.message);
        } finally {
            btn.innerHTML = originalText;
            btn.disabled = false;
        }
    });

    document.getElementById('registerForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const name = document.getElementById('regName').value.trim();
        const email = document.getElementById('regEmail').value.trim();
        const phone = document.getElementById('regPhone').value.trim();
        const password = document.getElementById('regPassword').value;
        const sponsor = document.getElementById('regSponsor').value.trim();
        
        if (!name || !email || !phone || !password) { alert('Please fill all required fields'); return; }
        if (password.length < 6) { alert('Password must be at least 6 characters'); return; }
        
        const btn = e.target.querySelector('button');
        const originalText = btn.innerHTML;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Creating account...';
        btn.disabled = true;
        
        try {
            const result = await registerUser({ name, email, phone, password, sponsor });
            if (result.success) {
                localStorage.setItem('currentUser', JSON.stringify(result.user));
                window.location.href = 'user-profile.html';
            } else {
                alert('❌ Registration failed: ' + result.error);
            }
        } catch (error) {
            alert('❌ Error: ' + error.message);
        } finally {
            btn.innerHTML = originalText;
            btn.disabled = false;
        }
    });

    window.logoutUser = function() {
        if (confirm('Are you sure you want to logout?')) {
            auth.signOut().then(() => {
                localStorage.removeItem('currentUser');
                window.location.href = 'index.html';
            });
        }
    };

    function updateNavbarForUser() {
        const currentUser = JSON.parse(localStorage.getItem('currentUser'));
        const btnJoinNow = document.getElementById('btnJoinNow');
        const btnJoinNowMobile = document.getElementById('btnJoinNowMobile');
        
        if (currentUser) {
            const userName = (currentUser.name || 'User').split(' ')[0];
            if (btnJoinNow) {
                btnJoinNow.innerHTML = `<i class="fas fa-user"></i> ${userName}`;
                btnJoinNow.href = 'user-dashboard.html';
            }
            if (btnJoinNowMobile) {
                btnJoinNowMobile.innerHTML = `<i class="fas fa-user-circle"></i> <span>Dashboard</span>`;
                btnJoinNowMobile.href = 'user-dashboard.html';
            }
        }
    }
    
    document.addEventListener('DOMContentLoaded', () => {
        updateCartCount();
        updateNavbarForUser();
    });

    window.updateCartCount = updateCartCount;
    window.registerUser = registerUser;
    window.loginUser = loginUser;
    window.createDefaultAdmin = createDefaultAdmin;
</script>
</body>
</html>
