<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - People Plus Network</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Poppins', sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; }
        .navbar { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); padding: 1rem 0; }
        .brand-text { display: inline-block; font-weight: 800; letter-spacing: 1px; color: white; font-size: 1.3rem; }
        @media (max-width: 768px) { .brand-text { font-size: 0.85rem; } .navbar-brand img { height: 35px !important; } }
        .auth-card { max-width: 550px; margin: 40px auto; background: white; border-radius: 30px; overflow: hidden; box-shadow: 0 25px 50px rgba(0,0,0,0.2); }
        .auth-header { background: linear-gradient(135deg, #667eea, #764ba2); padding: 30px; text-align: center; color: white; }
        .nav-pills { background: rgba(255,255,255,0.2); border-radius: 50px; padding: 5px; max-width: 300px; margin: 0 auto; display: flex; }
        .nav-pills .nav-link { color: white; border-radius: 50px; padding: 8px 30px; font-weight: 600; cursor: pointer; }
        .nav-pills .nav-link.active { background: white; color: #667eea; }
        .auth-body { padding: 35px; }
        .form-group { margin-bottom: 20px; }
        .form-group input { width: 100%; padding: 12px 15px; border: 1px solid #ddd; border-radius: 10px; }
        .btn-auth { background: linear-gradient(135deg, #667eea, #764ba2); color: white; border: none; width: 100%; padding: 14px; border-radius: 50px; font-weight: 600; }
        .payment-box { background: #f8f9fa; border: 1px solid #ddd; border-radius: 15px; }
        .home-link { text-align: center; margin-top: 25px; padding-top: 20px; border-top: 1px solid #eee; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg sticky-top">
    <div class="container">
        <a class="navbar-brand fw-bold d-flex align-items-center" href="index.html">
            <img src="img/site-logo.jpg" alt="Logo" style="height: 40px; border-radius: 6px; background: white; padding: 2px; margin-right: 8px;">
            <span class="brand-text">PEOPLE PLUS NETWORK</span>
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon bg-white rounded"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                <li class="nav-item"><a class="nav-link" href="products.html">Products</a></li>
                <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
                <li class="nav-item"><a class="nav-link" href="cart.html"><i class="fas fa-shopping-cart"></i> Cart <span id="cartCount" class="badge bg-danger">0</span></a></li>
                <li class="nav-item"><a class="nav-link" href="register.html">Login/Register</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="auth-card">
    <div class="auth-header">
        <i class="fas fa-users-cog fa-3x mb-3"></i>
        <h2>Welcome to People Plus</h2>
        <ul class="nav nav-pills" id="authTab">
            <li class="nav-item"><button class="nav-link active" data-bs-toggle="pill" data-bs-target="#login">Login</button></li>
            <li class="nav-item"><button class="nav-link" data-bs-toggle="pill" data-bs-target="#register">Join Now</button></li>
        </ul>
    </div>
    <div class="auth-body">
        <div class="tab-content">
            <div class="tab-pane fade show active" id="login">
                <form id="loginForm">
                    <div class="form-group"><label>Email</label><input type="email" id="loginEmail" required></div>
                    <div class="form-group"><label>Password</label><input type="password" id="loginPassword" required></div>
                    <button type="submit" class="btn-auth">Login Securely</button>
                </form>
                <div class="text-center mt-3"><small>Admin: admin@peopleplus.com / admin123</small></div>
            </div>
            <div class="tab-pane fade" id="register">
                <form id="registerForm">
                    <div class="form-group"><label>Full Name</label><input type="text" id="regName" required></div>
                    <div class="form-group"><label>Email</label><input type="email" id="regEmail" required></div>
                    <div class="form-group"><label>Phone</label><input type="tel" id="regPhone" required></div>
                    <div class="form-group"><label>Password (min 6 chars)</label><input type="password" id="regPassword" required></div>
                    <div class="form-group"><label>Sponsor ID</label><input type="text" id="regSponsor" placeholder="Optional"></div>
                    <div class="payment-box p-3 text-center mb-3">
                        <label class="text-danger fw-bold">Registration Fee: ₹499</label>
                        <img src="img/qr-code.png" alt="Payment QR" style="width: 160px; border: 4px solid black; padding: 5px; background: white; margin: 10px 0;">
                        <input type="text" class="form-control mb-2" id="transactionId" placeholder="Transaction ID / UTR" required>
                        <input type="number" class="form-control" id="amount" placeholder="Amount (₹499)" value="499" readonly>
                    </div>
                    <button type="submit" class="btn-auth">Pay ₹499 & Register</button>
                </form>
            </div>
        </div>
        <div class="home-link"><a href="index.html">← Back to Home</a></div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js"></script>
<script src="js/firebase-config.js"></script>
<script>
    function updateCartCount() {
        let cart = JSON.parse(localStorage.getItem('cart')) || [];
        document.getElementById('cartCount').innerText = cart.reduce((s, i) => s + i.quantity, 0);
    }
    updateCartCount();

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('loginEmail').value;
        const password = document.getElementById('loginPassword').value;
        const result = await window.firebaseAPI.loginUserFirebase(email, password);
        if (result.success) {
            localStorage.setItem('currentUser', JSON.stringify(result.user));
            alert('✅ Login successful!');
            window.location.href = result.user.role === 'admin' ? 'admin.html' : 'user-dashboard.html';
        } else {
            alert('❌ Login failed: ' + result.error);
        }
    });

    document.getElementById('registerForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const name = document.getElementById('regName').value;
        const email = document.getElementById('regEmail').value;
        const phone = document.getElementById('regPhone').value;
        const password = document.getElementById('regPassword').value;
        const sponsor = document.getElementById('regSponsor').value;
        const transactionId = document.getElementById('transactionId').value;
        const amount = document.getElementById('amount').value;

        if (!transactionId) { alert('Please enter Transaction ID'); return; }
        if (amount != 499) { alert('Amount must be ₹499'); return; }
        if (password.length < 6) { alert('Password must be at least 6 characters'); return; }

        const result = await window.firebaseAPI.registerUserFirebase({
            name, email, phone, password, sponsor,
            paymentStatus: 'completed', transactionId, amount
        });
        if (result.success) {
            localStorage.setItem('currentUser', JSON.stringify(result.user));
            alert('✅ Registration successful! Welcome!');
            window.location.href = 'user-dashboard.html';
        } else {
            alert('❌ Registration failed: ' + result.error);
        }
    });
</script>
</body>
</html>
