<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Admin - Orders</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Poppins', sans-serif; background: #f4f6f9; }
        
        .admin-sidebar {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: white;
            position: fixed;
            left: 0;
            top: 0;
            width: 260px;
            transition: all 0.3s;
            z-index: 1000;
        }
        .admin-sidebar .brand {
            padding: 25px;
            text-align: center;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .admin-sidebar .brand img {
            height: 50px;
            border-radius: 8px;
            margin-bottom: 10px;
            background: white;
            padding: 2px;
        }
        .admin-sidebar .brand h3 {
            font-size: 1.3rem;
            margin-bottom: 0;
        }
        .admin-sidebar .nav-link {
            color: rgba(255,255,255,0.7);
            padding: 12px 25px;
            margin: 5px 0;
            border-radius: 10px;
            text-decoration: none;
            display: block;
            font-size: 14px;
        }
        .admin-sidebar .nav-link:hover,
        .admin-sidebar .nav-link.active {
            background: rgba(255,255,255,0.1);
            color: white;
        }
        .admin-sidebar .nav-link i {
            width: 25px;
            margin-right: 10px;
        }
        
        .admin-content {
            margin-left: 260px;
            padding: 20px;
        }
        .admin-header {
            background: white;
            padding: 15px 20px;
            border-radius: 10px;
            margin-bottom: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .orders-table {
            background: white;
            border-radius: 15px;
            padding: 20px;
        }
        .sidebar-toggle {
            display: none;
        }
        
        .badge-pending { background: #ffc107; color: #333; }
        .badge-processing { background: #17a2b8; color: white; }
        .badge-delivered { background: #28a745; color: white; }
        .badge-cancelled { background: #dc3545; color: white; }
        
        @media (max-width: 992px) {
            .admin-sidebar { transform: translateX(-100%); }
            .admin-sidebar.show { transform: translateX(0); }
            .admin-content { margin-left: 0; }
            .sidebar-toggle { display: block; }
        }
        
        @media (max-width: 768px) {
            .admin-content { padding: 15px; }
            .orders-table { padding: 15px; font-size: 12px; }
        }
        
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #667eea; border-radius: 5px; }
    </style>
</head>
<body>

<div class="admin-sidebar" id="adminSidebar">
    <div class="brand">
        <img src="img/site-logo.jpg" alt="Logo">
        <h3 class="text-white">PeoplePlus</h3>
        <small class="opacity-75">Admin Panel</small>
    </div>
    <nav class="nav flex-column">
        <a class="nav-link" href="admin.html"><i class="fas fa-tachometer-alt"></i> Dashboard</a>
        <a class="nav-link" href="admin-users.html"><i class="fas fa-users"></i> Users</a>
        <a class="nav-link" href="admin-products.html"><i class="fas fa-box"></i> Products</a>
        <a class="nav-link active" href="admin-orders.html"><i class="fas fa-shopping-cart"></i> Orders</a>
        <a class="nav-link" href="admin-withdrawals.html"><i class="fas fa-money-bill-wave"></i> Withdrawals</a>
        <hr class="bg-light">
        <a class="nav-link" href="index.html"><i class="fas fa-globe"></i> View Website</a>
        <a class="nav-link" href="#" onclick="logoutUser()"><i class="fas fa-sign-out-alt"></i> Logout</a>
    </nav>
</div>

<div class="admin-content">
    <div class="admin-header">
        <div>
            <button class="btn btn-sm btn-outline-primary sidebar-toggle me-2" onclick="toggleSidebar()">
                <i class="fas fa-bars"></i>
            </button>
            <h4 class="mb-0 d-inline-block">Order Management</h4>
        </div>
        <div class="d-flex gap-2 flex-wrap">
            <select class="form-select form-select-sm w-auto" id="statusFilter" onchange="filterOrders()">
                <option value="all">All Orders</option>
                <option value="Pending">Pending</option>
                <option value="Processing">Processing</option>
                <option value="Delivered">Delivered</option>
            </select>
            <input type="text" class="form-control form-control-sm w-auto" placeholder="Search..." id="searchInput">
            <button class="btn btn-sm btn-primary" onclick="searchOrders()"><i class="fas fa-search"></i></button>
        </div>
    </div>
    
    <div class="orders-table">
        <div class="table-responsive">
            <table class="table table-hover table-sm">
                <thead>
                    <tr><th>Order ID</th><th>Customer</th><th>Amount</th><th>Status</th><th>Date</th><th>Actions</th></tr>
                </thead>
                <tbody id="ordersTableBody">
                    <tr><td colspan="6" class="text-center">Loading...<\/td><\/tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/auth.js"></script>
<script>
    const currentUser = JSON.parse(localStorage.getItem('currentUser'));
    if (!currentUser || currentUser.role !== 'admin') {
        window.location.href = 'register.html';
    }
    
    let allOrders = [];
    let filteredOrders = [];
    
    function toggleSidebar() {
        document.getElementById('adminSidebar').classList.toggle('show');
    }
    
    async function loadOrders() {
        allOrders = await window.firebaseAPI.getAllOrders();
        filteredOrders = [...allOrders];
        displayOrders();
    }
    
    function formatDate(dateString) {
        if (!dateString) return 'N/A';
        const date = new Date(dateString);
        return date.toLocaleDateString('en-IN');
    }
    
    function getStatusBadge(status) {
        if (status === 'Delivered') return '<span class="badge badge-delivered">✅ Delivered</span>';
        if (status === 'Processing') return '<span class="badge badge-processing">🔄 Processing</span>';
        if (status === 'Cancelled') return '<span class="badge badge-cancelled">❌ Cancelled</span>';
        return '<span class="badge badge-pending">⏳ Pending</span>';
    }
    
    function displayOrders() {
        const tbody = document.getElementById('ordersTableBody');
        if (filteredOrders.length === 0) {
            tbody.innerHTML = '<tr><td colspan="6" class="text-center">No orders found</td></tr>';
        } else {
            tbody.innerHTML = filteredOrders.map(o => `
                <tr>
                    <td><strong>#${o.orderId || o.id}</strong></td>
                    <td>${o.userName || 'User'}<br><small class="text-muted">${o.userEmail || ''}</small></td>
                    <td class="fw-bold">₹${(o.total || 0).toLocaleString()}</td>
                    <td>${getStatusBadge(o.status)}</td>
                    <td>${formatDate(o.date)}</td>
                    <td>
                        <select class="form-select form-select-sm" style="width: 120px;" onchange="updateStatus('${o.id}', this.value)">
                            <option value="Pending" ${o.status === 'Pending' ? 'selected' : ''}>⏳ Pending</option>
                            <option value="Processing" ${o.status === 'Processing' ? 'selected' : ''}>🔄 Processing</option>
                            <option value="Delivered" ${o.status === 'Delivered' ? 'selected' : ''}>✅ Delivered</option>
                        </select>
                    </td>
                </tr>
            `).join('');
        }
    }
    
    async function updateStatus(orderId, newStatus) {
        const order = allOrders.find(o => o.id === orderId);
        if (order) {
            const oldStatus = order.status;
            order.status = newStatus;
            
            const tracking = {
                ordered: true,
                confirmed: newStatus === 'Processing' || newStatus === 'Delivered',
                shipped: newStatus === 'Delivered',
                delivered: newStatus === 'Delivered'
            };
            
            await window.firebaseAPI.updateOrderStatus(orderId, newStatus, tracking);
            alert(`Order #${order.orderId || orderId} status updated from ${oldStatus} to ${newStatus}`);
            loadOrders();
        }
    }
    
    function filterOrders() {
        const status = document.getElementById('statusFilter').value;
        if (status === 'all') {
            filteredOrders = [...allOrders];
        } else {
            filteredOrders = allOrders.filter(o => o.status === status);
        }
        displayOrders();
    }
    
    function searchOrders() {
        const term = document.getElementById('searchInput').value.toLowerCase();
        filteredOrders = allOrders.filter(o => 
            (o.orderId || o.id || '').toLowerCase().includes(term) ||
            (o.userName || '').toLowerCase().includes(term) ||
            (o.userEmail || '').toLowerCase().includes(term)
        );
        displayOrders();
    }
    
    loadOrders();
</script>
</body>
</html>
