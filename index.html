<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#667eea">
    <title>People Plus Network</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* ===== BASE ===== */
        *{margin:0;padding:0;box-sizing:border-box;}
        body{font-family:'Poppins',sans-serif;background:#f4f6f9;padding-top:60px;padding-bottom:70px;}
        a{cursor:pointer;text-decoration:none;}

        /* ===== TOP NAVBAR ===== */
        .top-nav{position:fixed;top:0;left:0;right:0;z-index:1000;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 15px;box-shadow:0 2px 15px rgba(0,0,0,0.15);}
        .nav-brand{display:flex;align-items:center;gap:8px;cursor:pointer;}
        .nav-brand img{height:36px;border-radius:6px;background:white;padding:2px;flex-shrink:0;}
        .brand-name{font-weight:800;color:white;font-size:0.95rem;line-height:1.1;letter-spacing:.5px;}
        @media(max-width:400px){.brand-name{display:none;}}
        .nav-right{display:flex;align-items:center;gap:14px;}
        .cart-icon{position:relative;cursor:pointer;color:white;font-size:1.25rem;padding:5px;}
        .cart-badge{position:absolute;top:-4px;right:-4px;background:#ff4444;color:white;font-size:9px;font-weight:700;min-width:17px;height:17px;border-radius:50%;display:flex;align-items:center;justify-content:center;padding:0 3px;}
        .user-wrap{position:relative;}
        .user-avatar{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,0.2);border:2px solid rgba(255,255,255,0.5);display:flex;align-items:center;justify-content:center;cursor:pointer;color:white;font-size:0.95rem;font-weight:700;transition:.2s;}
        .user-avatar:hover{background:rgba(255,255,255,0.3);}
        .user-dropdown{position:absolute;right:0;top:46px;background:white;border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,0.15);min-width:200px;overflow:hidden;display:none;z-index:9999;}
        .user-dropdown.show-dropdown{display:block;}
        .user-dropdown a,.user-dropdown div.dp-link{display:flex;align-items:center;gap:10px;padding:11px 18px;color:#333;font-size:0.85rem;transition:.2s;cursor:pointer;}
        .user-dropdown a:hover,.user-dropdown div.dp-link:hover{background:#f0f4ff;color:#667eea;}
        .user-dropdown hr{margin:3px 0;border-color:#f0f0f0;}
        .dp-header{padding:12px 18px;border-bottom:1px solid #f0f0f0;}
        .dp-header strong{display:block;font-size:0.88rem;color:#333;}
        .dp-header small{color:#888;font-size:0.75rem;}

        /* ===== BOTTOM NAV ===== */
        .bottom-nav{position:fixed;bottom:0;left:0;right:0;z-index:999;background:white;box-shadow:0 -2px 15px rgba(0,0,0,0.08);display:flex;justify-content:space-around;align-items:stretch;height:65px;padding-bottom:env(safe-area-inset-bottom,0px);}
        .bn-item{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;flex:1;cursor:pointer;padding:6px 4px;color:#aaa;text-decoration:none;transition:.2s;border:none;background:none;position:relative;}
        .bn-item i{font-size:1.15rem;line-height:1;}
        .bn-item .bn-label{font-size:0.62rem;font-weight:600;line-height:1;}
        .bn-item.active{color:#667eea;}
        .bn-item.active i{color:#667eea;}
        .bn-badge{position:absolute;top:6px;left:calc(50% + 4px);background:#ff4444;color:white;font-size:8px;font-weight:700;min-width:15px;height:15px;border-radius:50%;display:flex;align-items:center;justify-content:center;padding:0 2px;line-height:1;}

        /* Desktop: no bottom nav, no bottom padding */
        @media(min-width:769px){
            .bottom-nav{display:none;}
            body{padding-bottom:0;}
        }

        /* ===== VIEW ANIMATION ===== */
        .view-enter{animation:fadeUp .22s ease-out;}
        @keyframes fadeUp{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}

        /* ===== COMMON COMPONENTS ===== */
        .loading-view{text-align:center;padding:80px 20px;}
        .loading-view i{color:#667eea;}
        .page-hero{background:linear-gradient(135deg,#667eea,#764ba2);padding:28px 20px;color:white;}
        .page-hero h2{font-size:1.4rem;font-weight:700;margin-bottom:4px;}
        .card-box{background:white;border-radius:14px;padding:18px;box-shadow:0 2px 10px rgba(0,0,0,.06);margin-bottom:15px;}
        .card-box h6{font-weight:700;margin-bottom:12px;color:#333;}
        .stat-card{background:white;border-radius:12px;padding:16px;box-shadow:0 2px 10px rgba(0,0,0,.06);}
        .s-icon{width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.2rem;color:white;}
        .s-val{font-size:1.5rem;font-weight:700;color:#333;}
        .s-lbl{font-size:.78rem;color:#888;}
        .btn-pp{background:linear-gradient(135deg,#667eea,#764ba2);color:white;border:none;padding:12px 20px;border-radius:50px;font-weight:600;font-size:.9rem;cursor:pointer;transition:.3s;font-family:'Poppins',sans-serif;display:inline-flex;align-items:center;gap:6px;}
        .btn-pp:hover{transform:translateY(-2px);box-shadow:0 5px 15px rgba(102,126,234,.4);}
        .btn-pp:disabled{opacity:.7;cursor:not-allowed;transform:none!important;box-shadow:none!important;}
        .btn-pp.w100{width:100%;justify-content:center;}
        .btn-outline-pp{border:2px solid #667eea;color:#667eea;background:none;padding:10px 20px;border-radius:50px;font-weight:600;font-size:.9rem;cursor:pointer;transition:.3s;font-family:'Poppins',sans-serif;}
        .btn-outline-pp:hover{background:#667eea;color:white;}
        .form-f{border-radius:10px;border:1.5px solid #e0e0e0;padding:11px 14px;font-family:'Poppins',sans-serif;font-size:.88rem;width:100%;transition:.2s;outline:none;background:white;}
        .form-f:focus{border-color:#667eea;box-shadow:0 0 0 3px rgba(102,126,234,.1);}
        .form-f:disabled{background:#f8f9fa;}
        .flabel{font-size:.82rem;font-weight:600;margin-bottom:5px;display:block;color:#444;}
        .fgroup{margin-bottom:14px;}

        /* ===== PRODUCT CARDS ===== */
        .product-card{background:white;border-radius:14px;overflow:hidden;box-shadow:0 3px 15px rgba(0,0,0,.07);transition:.3s;height:100%;display:flex;flex-direction:column;}
        .product-card:hover{transform:translateY(-5px);box-shadow:0 8px 25px rgba(0,0,0,.12);}
        .product-card img{width:100%;height:175px;object-fit:cover;}
        .pc-body{padding:12px;flex-grow:1;display:flex;flex-direction:column;}
        .pc-name{font-size:.9rem;font-weight:600;margin-bottom:4px;color:#333;}
        .pc-price{font-size:1.15rem;font-weight:700;color:#667eea;}
        .pc-mrp{text-decoration:line-through;color:#bbb;font-size:.8rem;margin-left:5px;}
        .discount-pill{background:#e8f5e9;color:#2e7d32;padding:2px 7px;border-radius:20px;font-size:.72rem;font-weight:700;}
        .btn-cart{background:linear-gradient(135deg,#667eea,#764ba2);color:white;border:none;width:100%;padding:9px;border-radius:25px;font-weight:600;font-size:.85rem;cursor:pointer;transition:.3s;margin-top:auto;font-family:'Poppins',sans-serif;}
        .btn-cart:hover{transform:scale(1.02);box-shadow:0 4px 12px rgba(102,126,234,.4);}

        /* ===== USER SIDEBAR (desktop) ===== */
        .user-sidebar-wrap{display:none;}
        @media(min-width:992px){.user-sidebar-wrap{display:block;}}
        .user-sidebar{background:white;border-radius:14px;padding:16px;box-shadow:0 2px 10px rgba(0,0,0,.06);position:sticky;top:76px;}
        .us-avatar{width:64px;height:64px;border-radius:50%;border:3px solid #667eea;object-fit:cover;}
        .us-link{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:10px;color:#555;font-size:.85rem;cursor:pointer;transition:.2s;text-decoration:none;margin-bottom:3px;}
        .us-link:hover,.us-link.active{background:linear-gradient(135deg,#667eea,#764ba2);color:white;}
        .us-link i{width:16px;text-align:center;}

        /* ===== BADGES ===== */
        .b-Pending{background:#fff3cd;color:#856404;padding:3px 9px;border-radius:20px;font-size:.72rem;font-weight:600;}
        .b-Confirmed{background:#cce5ff;color:#004085;padding:3px 9px;border-radius:20px;font-size:.72rem;font-weight:600;}
        .b-Shipped{background:#d4edda;color:#155724;padding:3px 9px;border-radius:20px;font-size:.72rem;font-weight:600;}
        .b-Delivered,.b-Approved{background:#d1e7dd;color:#0f5132;padding:3px 9px;border-radius:20px;font-size:.72rem;font-weight:600;}
        .b-Cancelled,.b-Rejected{background:#f8d7da;color:#721c24;padding:3px 9px;border-radius:20px;font-size:.72rem;font-weight:600;}
        .b-active{background:#d1e7dd;color:#0f5132;padding:3px 9px;border-radius:20px;font-size:.72rem;font-weight:600;}
        .b-blocked{background:#f8d7da;color:#721c24;padding:3px 9px;border-radius:20px;font-size:.72rem;font-weight:600;}

        /* ===== MISC ===== */
        .footer{background:#1a1a2e;color:rgba(255,255,255,.7);padding:25px 20px;text-align:center;font-size:.82rem;}
        .footer a{color:#ffd700;}
        .empty-state{text-align:center;padding:50px 20px;color:#999;}
        .empty-state i{font-size:2.5rem;margin-bottom:12px;display:block;}
        .divider{text-align:center;margin:14px 0;color:#bbb;font-size:.82rem;position:relative;}
        .divider::before,.divider::after{content:'';position:absolute;top:50%;width:40%;height:1px;background:#eee;}
        .divider::before{left:0;} .divider::after{right:0;}
        .alert-box{padding:11px 15px;border-radius:10px;font-size:.87rem;margin-bottom:14px;display:none;}
        .alert-box.err{background:#fde8e8;color:#c0392b;border:1px solid #f5c6cb;display:block;}
        .alert-box.ok{background:#e8f5e9;color:#1b5e20;border:1px solid #c8e6c9;display:block;}
        .tab-btns{display:flex;background:#f1f5f9;border-radius:50px;padding:4px;max-width:260px;margin:0 auto 20px;}
        .tab-btn{flex:1;padding:8px;border:none;border-radius:50px;font-weight:600;font-size:.87rem;cursor:pointer;transition:.3s;background:transparent;color:#64748b;font-family:'Poppins',sans-serif;}
        .tab-btn.active{background:linear-gradient(135deg,#667eea,#764ba2);color:white;box-shadow:0 2px 8px rgba(102,126,234,.3);}
        .referral-box{background:linear-gradient(135deg,#667eea,#764ba2);border-radius:14px;padding:18px;color:white;}
        .ref-input{background:rgba(255,255,255,.15);border:none;border-radius:8px;padding:10px 12px;color:white;font-size:.82rem;width:100%;word-break:break-all;font-family:'Poppins',sans-serif;}
        .ref-input::placeholder{color:rgba(255,255,255,.6);}
        .plan-card{background:white;border-radius:14px;padding:20px;text-align:center;box-shadow:0 3px 15px rgba(0,0,0,.06);border-top:4px solid #667eea;}
        .member-card{border:1.5px solid #f0f0f0;border-radius:12px;padding:13px;display:flex;align-items:center;gap:12px;transition:.2s;margin-bottom:8px;}
        .member-card:hover{border-color:#667eea;background:#f8f9ff;}
        .m-avatar{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#667eea,#764ba2);display:flex;align-items:center;justify-content:center;color:white;font-weight:700;font-size:1rem;flex-shrink:0;}
        .order-card{border:1.5px solid #f0f0f0;border-radius:12px;padding:15px;transition:.2s;margin-bottom:10px;}
        .order-card:hover{border-color:#667eea;}
        .t-track{display:flex;align-items:center;flex-wrap:wrap;gap:4px;margin-top:10px;}
        .t-step{display:flex;align-items:center;gap:4px;font-size:.72rem;font-weight:500;}
        .t-dot{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;}
        .t-step.done .t-dot{background:#28a745;color:white;}
        .t-step.pending .t-dot{background:#e0e0e0;color:#999;}
        .t-line{flex:1;height:2px;background:#e0e0e0;min-width:15px;}
        .t-line.done{background:#28a745;}
        .w-wallet{background:linear-gradient(135deg,#11998e,#38ef7d);border-radius:14px;padding:22px;color:white;text-align:center;margin-bottom:18px;}
        .comm-row{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid #f5f5f5;}
        .comm-row:last-child{border-bottom:none;}
        .c-icon{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:.9rem;flex-shrink:0;}
        .info-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #f5f5f5;}
        .info-row:last-child{border-bottom:none;}
        .info-row i{color:#667eea;width:18px;text-align:center;}
        .qty-btn{width:28px;height:28px;border-radius:7px;border:1.5px solid #ddd;background:#f8f9fa;cursor:pointer;font-size:1rem;display:flex;align-items:center;justify-content:center;transition:.2s;}
        .qty-btn:hover{background:#667eea;color:white;border-color:#667eea;}
        @media(max-width:768px){.hidden-mobile{display:none!important;}}
        ::-webkit-scrollbar{width:5px;height:5px;}
        ::-webkit-scrollbar-thumb{background:#667eea;border-radius:5px;}
        @keyframes slideUp{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:translateY(0);}}
    </style>
</head>
<body>

<!-- ===== TOP NAVBAR ===== -->
<nav class="top-nav">
    <div class="nav-brand" onclick="navigate('/')">
        <img src="img/site-logo.jpg" alt="Logo">
        <span class="brand-name">PEOPLE PLUS<br>NETWORK</span>
    </div>
    <div class="nav-right">
        <!-- User Menu -->
        <div class="user-wrap">
            <div class="user-avatar" id="userAvatar" onclick="toggleUserMenu(event)"><i class="fas fa-user"></i></div>
            <div class="user-dropdown" id="userDropdown">
                <a onclick="navigate('/login')"><i class="fas fa-sign-in-alt"></i> Login</a>
            </div>
        </div>
    </div>
</nav>

<!-- ===== MAIN APP ===== -->
<div class="app-wrap" id="app">
    <div class="loading-view">
        <i class="fas fa-spinner fa-spin fa-3x mb-3 d-block"></i>
        <p style="color:#888;font-size:.9rem;">Loading...</p>
    </div>
</div>

<!-- ===== BOTTOM NAV (USER) ===== -->
<nav class="bottom-nav" id="bottomNav">
    <button class="bn-item" id="bn-home" onclick="navigate('/')">
        <i class="fas fa-home"></i>
        <span class="bn-label">Home</span>
    </button>
    <button class="bn-item" id="bn-about" onclick="navigate('/about')">
        <i class="fas fa-info-circle"></i>
        <span class="bn-label">About</span>
    </button>
    <button class="bn-item" id="bn-shop" onclick="navigate('/products')">
        <i class="fas fa-store"></i>
        <span class="bn-label">Shop</span>
    </button>
    <button class="bn-item" id="bn-me" onclick="navigate('/dashboard')">
        <i class="fas fa-user"></i>
        <span class="bn-label">Me</span>
    </button>
</nav>

<!-- ===== BOTTOM NAV (ADMIN) ===== -->
<nav class="bottom-nav" id="adminBottomNav" style="display:none;">
    <button class="bn-item" id="bn-a-dash" onclick="navigate('/admin')">
        <i class="fas fa-tachometer-alt"></i>
        <span class="bn-label">Home</span>
    </button>
    <button class="bn-item" id="bn-a-users" onclick="navigate('/admin/users')">
        <i class="fas fa-users"></i>
        <span class="bn-label">Users</span>
    </button>
    <button class="bn-item" id="bn-a-prods" onclick="navigate('/admin/products')">
        <i class="fas fa-box"></i>
        <span class="bn-label">Products</span>
    </button>
    <button class="bn-item" id="bn-a-orders" onclick="navigate('/admin/orders')">
        <i class="fas fa-shopping-cart"></i>
        <span class="bn-label">Orders</span>
    </button>
</nav>

<!-- ===== TOAST CONTAINER ===== -->
<div id="toastBox" style="position:fixed;bottom:80px;right:0;left:0;display:flex;flex-direction:column;align-items:center;gap:8px;z-index:9999;pointer-events:none;"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
